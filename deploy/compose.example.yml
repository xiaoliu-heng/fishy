name: partygame

services:
  app:
    image: ${PARTYGAME_IMAGE:?Set the verified release image in .env}
    restart: unless-stopped
    init: true
    user: "${PARTYGAME_UID:-1000}:${PARTYGAME_GID:-1000}"
    environment:
      NODE_ENV: production
      PORT: "4173"
    ports:
      - "${PARTYGAME_BIND_IP:-127.0.0.1}:4173:4173"
    volumes:
      - ./data:/app/.data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    stop_grace_period: 10s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4173/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
